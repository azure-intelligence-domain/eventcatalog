name: catalog

# Pull requests: build and test. main, daily and on demand: build, then deploy to Azure Static
# Web Apps (Free) through the GitHub environment "azure" (OIDC, no stored deployment token).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily, to pick up newly released contracts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Discover, generate, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover released contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover
      - run: npx eventcatalog generate
      - run: npm test
      - name: Build (broken links fail the build)
        run: npx eventcatalog build
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-intplat-eventcatalog
      APP: stapp-intplat-eventcatalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: dist

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructure (what-if, then deploy)
        run: |
          az deployment group what-if -g "$RESOURCE_GROUP" -n eventcatalog -f infra/main.bicep
          hostname=$(az deployment group create -g "$RESOURCE_GROUP" -n eventcatalog -f infra/main.bicep \
            --query properties.outputs.hostname.value -o tsv)
          echo "CATALOG_HOST=$hostname" >> "$GITHUB_ENV"

      - name: Fetch the deployment token (never stored)
        run: |
          token=$(az staticwebapp secrets list -n "$APP" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Upload the catalog
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          curl -fsS "https://${CATALOG_HOST}/" | grep -q "Azure Intelligence Domain"
          curl -fsS "https://${CATALOG_HOST}/docs/custom/platform/01-the-envelope" | grep -q "correlationid"
          echo "✅ https://${CATALOG_HOST}"
