name: catalog

# Pull requests: build and test. main, daily and on demand: build twice and publish to two hosts:
# - Azure Storage static website (base "/"), through the GitHub environment "azure" (OIDC);
# - GitHub Pages (base "/eventcatalog"), https://azure-intelligence-domain.github.io/eventcatalog/

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily, to pick up newly released contracts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Discover, generate, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover released contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover
      - run: npx eventcatalog generate
      - run: npm test
      - name: Build for Azure Storage (base /; broken links fail the build)
        run: npx eventcatalog build && mv dist dist-storage
      - name: Build for GitHub Pages (base /eventcatalog)
        env:
          CATALOG_BASE: /eventcatalog
        run: npx eventcatalog build
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist-storage
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          check() { curl -fsSL "${PAGE_URL%/}/$1" | grep -q "$2"; }
          for attempt in $(seq 1 12); do
            if check "" "Azure Intelligence Domain" && check "docs/custom/platform/01-the-envelope/" "correlationid" \
               && check "docs/domains/platform/1.0.0" "Integration Platform"; then
              echo "✅ $PAGE_URL"; exit 0
            fi
            echo "attempt $attempt: not served yet"; sleep 10
          done
          exit 1

  deploy:
    name: Deploy to the storage static website
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-intplat-eventcatalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: catalog
          path: dist

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructure (what-if, then deploy)
        run: |
          az deployment group what-if -g "$RESOURCE_GROUP" -n eventcatalog -f infra/main.bicep
          read -r account url < <(az deployment group create -g "$RESOURCE_GROUP" -n eventcatalog \
            -f infra/main.bicep --query "[properties.outputs.accountName.value, properties.outputs.url.value]" -o tsv | paste -sd' ')
          echo "ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "CATALOG_URL=${url%/}" >> "$GITHUB_ENV"

      - name: Fetch the storage key (never stored)
        run: |
          key=$(az storage account keys list -g "$RESOURCE_GROUP" -n "$ACCOUNT" --query "[0].value" -o tsv)
          echo "::add-mask::$key"
          echo "AZURE_STORAGE_KEY=$key" >> "$GITHUB_ENV"

      - name: Enable the static website and upload the catalog
        env:
          AZURE_STORAGE_ACCOUNT: ${{ env.ACCOUNT }}
        run: |
          az storage blob service-properties update --static-website \
            --index-document index.html --404-document 404.html --only-show-errors -o none
          az storage blob sync --container '$web' --source dist --delete-destination true --only-show-errors -o none

      - name: Smoke test
        run: |
          # A freshly enabled static website can take a minute before it serves content.
          check() { curl -fsS "$CATALOG_URL/$1" | grep -q "$2"; }
          for attempt in $(seq 1 12); do
            if check "" "Azure Intelligence Domain" && check "docs/custom/platform/01-the-envelope/" "correlationid" && check "docs/domains/sales/1.0.0" "Sales"; then
              echo "✅ $CATALOG_URL"; exit 0
            fi
            for page in "" "docs/custom/platform/01-the-envelope/" "docs/domains/sales/1.0.0" "docs/domains/sales/1.0.0/"; do
              echo "attempt $attempt: /$page -> $(curl -s -o /dev/null -w '%{http_code}' "$CATALOG_URL/$page")"
            done
            sleep 10
          done
          exit 1
